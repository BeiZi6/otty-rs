[package]
name = "otty-shell"
description = "The Slint shell: window, titlebar, tab bar, sidebar, panes and the settings panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The whole point of this crate is that it is thin. Everything that decides *what
# is on screen* lives in `otty-ui` (the model and layout), `otty-render` (the
# pixels) and `otty-term` (the grid); this crate binds those to Slint properties
# and does nothing else. A rule of thumb worth keeping: if a line here needs a
# test, it belongs in `otty-ui`.
[dependencies]
otty-core = { workspace = true }
otty-config = { workspace = true }
otty-term = { workspace = true }
otty-pty = { workspace = true }
otty-ui = { workspace = true }
otty-ipc = { workspace = true }
otty-render = { workspace = true }
otty-fonts = { workspace = true }
slint = { workspace = true }
log = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "otty-app"
path = "src/main.rs"

[build-dependencies]
slint-build = { workspace = true }
