[package]
name = "depcheck"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
portable-pty = "0.9"
vte = "0.15"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-bidi = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
tempfile = "3"
regex = "1"
base64 = "0.22"
notify = "6"
dirs = "6"
libc = "0.2"
bytemuck = "1"
pollster = "0.4"
image = "0.25"
syntect = "5"
pulldown-cmark = "0.12"
qrcode = "0.14"
which = "7"
jiff = "0.2"
url = "2"
percent-encoding = "2"
walkdir = "2"
glob = "0.3"
aho-corasick = "1"
fontdb = "0.23"
swash = "0.2"
wgpu = "26"
winit = "0.30"
raw-window-handle = "0.6"
crossbeam-channel = "0.5"
rfd = "0.15"
arboard = "3"
open = "5"
